<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ペットシッター報告 — モック</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #d1d5db; }
    .screen { display: none; min-height: 100vh; }
    .screen.active { display: block; }
    input, select, textarea { font-size: 16px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.7s linear infinite; display: inline-block; }
    @keyframes mic-pulse { 0%,100%{transform:scale(1); opacity:1;} 50%{transform:scale(1.04); opacity:0.8;} }
    .mic-pulse { animation: mic-pulse 0.9s ease-in-out infinite; }
    /* 大きいチェックボックス */
    input[type=checkbox] { cursor: pointer; }
    label { cursor: pointer; user-select: none; }
    ::-webkit-scrollbar { display: none; }
  </style>
</head>
<body>

<div class="max-w-[390px] mx-auto min-h-screen bg-gray-50 shadow-2xl overflow-hidden">

  <!-- ======== HOME ======== -->
  <div id="s-home" class="screen active">
    <div class="flex flex-col min-h-screen bg-gradient-to-b from-emerald-50 to-gray-50">
      <div class="flex-1 flex flex-col items-center justify-center px-6 gap-8 pt-12">
        <div class="text-center">
          <div class="text-7xl mb-3">🐾</div>
          <h1 class="text-2xl font-bold text-gray-900">ペットシッター報告</h1>
          <p class="text-sm text-gray-500 mt-1">音声入力 → AI が報告文を作成 → LINEで送信</p>
        </div>
        <div class="w-full space-y-3">
          <button onclick="startReport()"
            class="w-full bg-emerald-600 text-white py-5 rounded-2xl text-lg font-bold shadow-lg flex items-center justify-center gap-3 active:bg-emerald-700 transition-colors">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            新しい報告書を作成
          </button>
          <button onclick="go('clients')"
            class="w-full border border-gray-300 bg-white text-gray-700 py-4 rounded-2xl text-sm font-medium shadow-sm flex items-center justify-center gap-2 active:bg-gray-50">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            顧客・ペット管理
          </button>
        </div>
        <p id="home-count" class="text-xs text-gray-400"></p>
      </div>
      <footer class="text-center text-xs text-gray-300 pb-8">ストレンジブレイン株式会社</footer>
    </div>
  </div>

  <!-- ======== CLIENTS ======== -->
  <div id="s-clients" class="screen bg-gray-50">
    <header class="bg-white border-b border-gray-200 px-4 py-4 flex items-center gap-3 sticky top-0 z-10">
      <button onclick="go('home')" class="text-gray-500 p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="text-lg font-bold text-gray-900 flex-1">顧客・ペット管理</h1>
      <button onclick="openModal('add-client')" class="bg-emerald-600 text-white text-sm px-3 py-1.5 rounded-lg font-medium">＋ 追加</button>
    </header>
    <div id="clients-list" class="p-4 space-y-3 pb-10"></div>
  </div>

  <!-- ======== REPORT FORM ======== -->
  <div id="s-report" class="screen bg-gray-50">
    <header class="bg-white border-b border-gray-200 px-4 py-4 flex items-center gap-3 sticky top-0 z-10">
      <button onclick="go('home')" class="text-gray-500 p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="text-lg font-bold text-gray-900">報告書を作成</h1>
    </header>

    <div class="p-4 space-y-4 pb-10">

      <!-- ① 顧客・ペット -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-3">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wide">お客様・ペット</h2>
        <select id="r-client" onchange="onClientChange()"
          class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-emerald-500"></select>
        <p id="r-pet-info" class="text-xs text-gray-400"></p>
      </div>

      <!-- ② 訪問日時 -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-3">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wide">訪問日時</h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-500 mb-1 block">開始</label>
            <input type="datetime-local" id="r-start"
              class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
          </div>
          <div>
            <label class="text-xs text-gray-500 mb-1 block">終了時刻</label>
            <input type="time" id="r-end"
              class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
          </div>
        </div>
      </div>

      <!-- ③ 基本確認（ペット種別で切替） -->
      <div id="r-basics" class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-4"></div>

      <!-- ④ お世話の様子（メイン・音声入力） -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-3">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wide">お世話の様子</h2>
        <p class="text-xs text-gray-400">散歩の様子、ペットの状態、気になることなど自由に</p>
        <textarea id="f-notes" rows="9" placeholder="例：今日は雨だったのでカッパを着用しました。四中の裏の道を散歩して、公園で休憩しました。マーキスくんはおやつが欲しそうで何度も目線を合わせてきました。帰宅後は体をしっかり拭いてゴハンをあげました。"
          class="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm leading-relaxed focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none bg-gray-50 transition-colors"></textarea>

        <!-- 大きい音声入力ボタン -->
        <button id="mic-btn" onclick="toggleMic()"
          class="w-full py-5 rounded-2xl text-base font-bold flex items-center justify-center gap-3 bg-emerald-600 text-white shadow-md active:bg-emerald-700 transition-all">
          <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V21h2v-2.28c3.28-.49 6-3.3 6-6.72h-1.7z"/>
          </svg>
          押して話す
        </button>
        <p id="speech-note" class="text-xs text-center text-gray-300 hidden">音声入力は Safari で動作します</p>
      </div>

      <!-- ⑤ 退出確認 -->
      <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 space-y-3">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wide">退出</h2>
        <label class="flex items-center gap-3">
          <input type="checkbox" id="chk-lock" class="w-6 h-6 rounded accent-emerald-600"/>
          <span class="text-sm font-medium text-gray-700">施錠・退出済み</span>
        </label>
        <div>
          <label class="text-xs text-gray-500 mb-2 block">次回訪問予定（任意）</label>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="text-xs text-gray-400 mb-1 block">日付・開始</label>
              <input type="datetime-local" id="f-next-start"
                class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
            </div>
            <div>
              <label class="text-xs text-gray-400 mb-1 block">終了時刻</label>
              <input type="time" id="f-next-end"
                class="w-full border border-gray-300 rounded-lg px-2 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/>
            </div>
          </div>
        </div>
      </div>

      <!-- エラー -->
      <div id="r-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-xl"></div>

      <!-- 生成ボタン -->
      <button id="btn-gen" onclick="handleGenerate()"
        class="w-full bg-emerald-600 text-white py-4 rounded-xl text-base font-bold shadow-md flex items-center justify-center gap-2 active:bg-emerald-700 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        AIで報告文を生成
      </button>
    </div>
  </div>

  <!-- ======== PREVIEW ======== -->
  <div id="s-preview" class="screen bg-gray-50">
    <header class="bg-white border-b border-gray-200 px-4 py-4 flex items-center gap-3 sticky top-0 z-10">
      <button onclick="go('report')" class="text-gray-500 p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <h1 class="text-lg font-bold text-gray-900">報告文プレビュー</h1>
    </header>
    <div class="p-4 flex flex-col gap-4 pb-10">
      <div id="copy-banner"
        class="text-center text-sm font-medium py-2 rounded-lg transition-all duration-300 opacity-0 bg-emerald-100 text-emerald-700">
        ✓ コピーしました！LINEに貼り付けてください
      </div>
      <div>
        <p class="text-xs text-gray-400 mb-1">内容を直接修正できます</p>
        <textarea id="preview-text" rows="18"
          class="w-full border border-gray-200 rounded-xl p-4 text-sm text-gray-800 leading-relaxed focus:outline-none focus:ring-2 focus:ring-emerald-500 resize-none bg-white shadow-sm"></textarea>
      </div>
      <button onclick="copyReport()"
        class="w-full bg-emerald-600 text-white py-4 rounded-xl text-base font-bold shadow-md flex items-center justify-center gap-2 active:bg-emerald-700">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        テキストをコピー
      </button>
      <button onclick="go('home')" class="w-full border border-gray-300 text-gray-700 py-3.5 rounded-xl text-sm font-medium">
        新しい報告書を作成
      </button>
    </div>
  </div>

  <!-- ======== MODAL ======== -->
  <div id="modal-bg" onclick="closeModal()" class="fixed inset-0 bg-black/50 z-40 hidden"
    style="max-width:390px;left:50%;transform:translateX(-50%);"></div>
  <div id="modal-box" class="fixed bottom-0 left-1/2 -translate-x-1/2 bg-white rounded-t-2xl w-full z-50 hidden p-6 pb-8"
    style="max-width:390px;">
    <div id="modal-inner"></div>
  </div>

</div><!-- /frame -->

<script>
// ──────────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────────
let clients   = []
let counts    = { pee: 0, poop: 0 }
let isRecording = false
let recognizer  = null
const speechOK  = !!(window.SpeechRecognition || window.webkitSpeechRecognition)

// ──────────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────────
function init() {
  clients = JSON.parse(localStorage.getItem('ps-clients') || 'null') || seedClients()

  if (!speechOK) {
    document.getElementById('speech-note').classList.remove('hidden')
    const btn = document.getElementById('mic-btn')
    btn.disabled = true
    btn.classList.add('opacity-40')
    btn.title = 'Safari/iOS で利用可能'
  }

  // デフォルト日時
  const now = new Date()
  now.setMinutes(now.getMinutes() < 30 ? 0 : 30, 0, 0)
  const p = n => String(n).padStart(2,'0')
  document.getElementById('r-start').value =
    `${now.getFullYear()}-${p(now.getMonth()+1)}-${p(now.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}`
  const end = new Date(now.getTime() + 3600000)
  document.getElementById('r-end').value = `${p(end.getHours())}:${p(end.getMinutes())}`

  // 次回訪問：翌日の同じ時間帯をデフォルトに
  const nextDay = new Date(now.getTime() + 86400000)
  document.getElementById('f-next-start').value =
    `${nextDay.getFullYear()}-${p(nextDay.getMonth()+1)}-${p(nextDay.getDate())}T${p(now.getHours())}:${p(now.getMinutes())}`
  document.getElementById('f-next-end').value = `${p(end.getHours())}:${p(end.getMinutes())}`

  refreshCount()
}

function seedClients() {
  const d = [
    { id:'1', name:'田中様', pets:[{ id:'1a', name:'マーキス', type:'dog', notes:'雨の日はカッパ着用' }] },
    { id:'2', name:'鈴木様', pets:[{ id:'2a', name:'ししお', type:'cat', notes:'' },{ id:'2b', name:'ささみ', type:'cat', notes:'' }] },
    { id:'3', name:'山田様', pets:[{ id:'3a', name:'福', type:'dog', notes:'' }] },
  ]
  save(d); return d
}

// ──────────────────────────────────────────────────
// NAVIGATION
// ──────────────────────────────────────────────────
function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'))
  const s = document.getElementById('s-'+id)
  if (s) { s.classList.add('active'); s.scrollTop = 0 }
  if (id === 'clients') renderClientList()
  if (id === 'home')    refreshCount()
  if (id === 'report')  stopMic()
}

function startReport() {
  clients = JSON.parse(localStorage.getItem('ps-clients') || '[]')
  if (!clients.length) { alert('まず顧客・ペットを登録してください'); go('clients'); return }
  if (!clients.some(c => c.pets.length)) { alert('ペットを登録してください'); go('clients'); return }
  populateSel()
  go('report')
}

// ──────────────────────────────────────────────────
// CLIENTS SCREEN
// ──────────────────────────────────────────────────
function renderClientList() {
  const el = document.getElementById('clients-list')
  if (!clients.length) {
    el.innerHTML = '<p class="text-center text-gray-400 py-12 text-sm">まだ顧客が登録されていません</p>'
    return
  }
  el.innerHTML = clients.map((c,ci) => `
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="px-4 py-3 flex items-center justify-between">
        <span class="font-semibold text-gray-900">${esc(c.name)}</span>
        <div class="flex gap-2">
          <button onclick="openModal('edit-client',${ci})" class="text-xs text-blue-600 px-2 py-1 rounded border border-blue-200">編集</button>
          <button onclick="delClient(${ci})"              class="text-xs text-red-500  px-2 py-1 rounded border border-red-200">削除</button>
        </div>
      </div>
      <div class="border-t border-gray-100 px-4 pb-3">
        ${c.pets.map((p,pi) => `
          <div class="flex items-center justify-between py-2 border-b border-gray-50 last:border-0">
            <span class="text-sm text-gray-700">${p.type==='dog'?'🐶':'🐱'} ${esc(p.name)}${p.notes?` <span class="text-gray-400 text-xs">— ${esc(p.notes)}</span>`:''}</span>
            <div class="flex gap-2">
              <button onclick="openModal('edit-pet',${ci},${pi})" class="text-xs text-blue-600 px-2 py-0.5 rounded border border-blue-200">編集</button>
              <button onclick="delPet(${ci},${pi})"               class="text-xs text-red-500  px-2 py-0.5 rounded border border-red-200">削除</button>
            </div>
          </div>
        `).join('')}
        <button onclick="openModal('add-pet',${ci})" class="mt-2 text-xs text-emerald-600 font-medium">＋ ペットを追加</button>
      </div>
    </div>
  `).join('')
}

function save(d) { if(d) clients=d; localStorage.setItem('ps-clients', JSON.stringify(clients)) }
function saveR()  { save(); renderClientList(); refreshCount() }
function refreshCount() {
  const n = clients.reduce((s,c)=>s+c.pets.length,0)
  document.getElementById('home-count').textContent = clients.length ? `${clients.length}件の顧客 / ${n}頭登録済み` : ''
}
function uid() { return Date.now().toString(36)+Math.random().toString(36).slice(2) }
function delClient(ci) { if(!confirm('削除してよいですか？')) return; clients.splice(ci,1); saveR() }
function delPet(ci,pi) { if(!confirm('削除してよいですか？')) return; clients[ci].pets.splice(pi,1); saveR() }

// ──────────────────────────────────────────────────
// MODAL
// ──────────────────────────────────────────────────
let _pt = 'dog'
function openModal(type, ci, pi) {
  const inner = document.getElementById('modal-inner')
  if      (type==='add-client')  inner.innerHTML = cForm('顧客を追加','',`addC()`)
  else if (type==='edit-client') inner.innerHTML = cForm('顧客を編集',clients[ci].name,`updC(${ci})`)
  else if (type==='add-pet')   { _pt='dog';  inner.innerHTML = pForm('ペットを追加',ci,null,null) }
  else if (type==='edit-pet')  { _pt=clients[ci].pets[pi].type; inner.innerHTML = pForm('ペットを編集',ci,pi,clients[ci].pets[pi]) }
  document.getElementById('modal-bg').classList.remove('hidden')
  document.getElementById('modal-box').classList.remove('hidden')
  setTimeout(()=>{ const i=document.querySelector('#modal-inner input[type=text]'); if(i) i.focus() },100)
}
function closeModal() {
  document.getElementById('modal-bg').classList.add('hidden')
  document.getElementById('modal-box').classList.add('hidden')
}
const X = `<button onclick="closeModal()" class="text-gray-400 text-xl leading-none">✕</button>`
function cForm(title,val,cmd) {
  return `<div class="flex items-center justify-between mb-4"><h2 class="font-bold text-gray-900">${title}</h2>${X}</div>
  <div class="space-y-4">
    <div><label class="block text-sm font-medium text-gray-700 mb-1">お客様名</label>
      <input id="m-cn" type="text" value="${esc(val)}" placeholder="例：田中様"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
        onkeydown="if(event.key==='Enter')${cmd}"/></div>
    <div class="flex gap-3">
      <button onclick="closeModal()" class="flex-1 border border-gray-300 text-gray-700 py-2.5 rounded-xl text-sm font-medium">キャンセル</button>
      <button onclick="${cmd}" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-medium">保存</button>
    </div>
  </div>`
}
function pForm(title,ci,pi,p) {
  const n=p?.name||'', nt=p?.notes||'', t=p?.type||'dog'
  return `<div class="flex items-center justify-between mb-4"><h2 class="font-bold text-gray-900">${title}</h2>${X}</div>
  <div class="space-y-4">
    <div><label class="block text-sm font-medium text-gray-700 mb-1">ペット名</label>
      <input id="m-pn" type="text" value="${esc(n)}" placeholder="例：マーキス"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/></div>
    <div><label class="block text-sm font-medium text-gray-700 mb-2">種類</label>
      <div class="flex gap-3">
        <button id="m-dog" onclick="setPT('dog')" class="flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${t==='dog'?'bg-emerald-600 text-white border-emerald-600':'border-gray-300 text-gray-700'}">🐶 犬</button>
        <button id="m-cat" onclick="setPT('cat')" class="flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${t==='cat'?'bg-emerald-600 text-white border-emerald-600':'border-gray-300 text-gray-700'}">🐱 猫</button>
      </div></div>
    <div><label class="block text-sm font-medium text-gray-700 mb-1">メモ（任意）</label>
      <input id="m-pnt" type="text" value="${esc(nt)}" placeholder="例：臆病、カッパあり"
        class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"/></div>
    <div class="flex gap-3">
      <button onclick="closeModal()" class="flex-1 border border-gray-300 text-gray-700 py-2.5 rounded-xl text-sm font-medium">キャンセル</button>
      <button onclick="${pi!==null?`updP(${ci},${pi})`:`addP(${ci})`}" class="flex-1 bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-medium">保存</button>
    </div>
  </div>`
}
function setPT(t) {
  _pt=t
  const d=document.getElementById('m-dog'), c=document.getElementById('m-cat')
  if(!d||!c)return
  d.className=`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${t==='dog'?'bg-emerald-600 text-white border-emerald-600':'border-gray-300 text-gray-700'}`
  c.className=`flex-1 py-2.5 rounded-xl border text-sm font-medium transition-colors ${t==='cat'?'bg-emerald-600 text-white border-emerald-600':'border-gray-300 text-gray-700'}`
}
function addC()     { const n=document.getElementById('m-cn').value.trim(); if(!n)return; clients.push({id:uid(),name:n,pets:[]}); saveR(); closeModal() }
function updC(ci)   { const n=document.getElementById('m-cn').value.trim(); if(!n)return; clients[ci].name=n; saveR(); closeModal() }
function addP(ci)   { const n=document.getElementById('m-pn').value.trim(); if(!n)return; const nt=document.getElementById('m-pnt').value.trim(); clients[ci].pets.push({id:uid(),name:n,type:_pt,notes:nt}); saveR(); closeModal() }
function updP(ci,pi){ const n=document.getElementById('m-pn').value.trim(); if(!n)return; const nt=document.getElementById('m-pnt').value.trim(); clients[ci].pets[pi]={...clients[ci].pets[pi],name:n,type:_pt,notes:nt}; saveR(); closeModal() }

// ──────────────────────────────────────────────────
// REPORT FORM — CLIENT/PET SELECTOR
// ──────────────────────────────────────────────────
function populateSel() {
  const withPets = clients.filter(c=>c.pets.length)
  document.getElementById('r-client').innerHTML = withPets.map((c,i)=>`<option value="${i}">${esc(c.name)}</option>`).join('')
  onClientChange()
}
function onClientChange() {
  const ci = +document.getElementById('r-client').value
  const c  = clients.filter(c=>c.pets.length)[ci]
  if (!c) return
  // 全ペットを表示（選択不要）
  const petNames = c.pets.map(p=>`${p.type==='dog'?'🐶':'🐱'} ${p.name}${p.notes?' ('+p.notes+')':''}`).join('　')
  document.getElementById('r-pet-info').textContent = `対象ペット：${petNames}`
  const hasDog = c.pets.some(p=>p.type==='dog')
  const hasCat = c.pets.some(p=>p.type==='cat')
  renderBasics(hasDog, hasCat)
  counts = { pee:0, poop:0 }
  statuses = {}
}

// ──────────────────────────────────────────────────
// 基本確認セクション（排泄カウンター＋チェック）
// ──────────────────────────────────────────────────
function renderBasics(hasDog, hasCat) {
  const el = document.getElementById('r-basics')
  const excLabel = hasCat && !hasDog ? 'トイレの状況' : '排泄の状況'
  let checks = ''
  if (hasDog) checks += `
    <label class="flex items-center gap-2.5">
      <input type="checkbox" id="chk-feed"  class="w-6 h-6 rounded accent-emerald-600"/>
      <span class="text-sm text-gray-700">🍚 ゴハン食べた</span>
    </label>
    <label class="flex items-center gap-2.5">
      <input type="checkbox" id="chk-water-dog" class="w-6 h-6 rounded accent-emerald-600"/>
      <span class="text-sm text-gray-700">💧 お水飲んだ</span>
    </label>`
  if (hasCat) checks += `
    <label class="flex items-center gap-2.5">
      <input type="checkbox" id="chk-toilet" class="w-6 h-6 rounded accent-emerald-600"/>
      <span class="text-sm text-gray-700">🧹 トイレ掃除済み</span>
    </label>
    <label class="flex items-center gap-2.5">
      <input type="checkbox" id="chk-water-cat" class="w-6 h-6 rounded accent-emerald-600"/>
      <span class="text-sm text-gray-700">💧 お水を交換</span>
    </label>
    <label class="flex items-center gap-2.5">
      <input type="checkbox" id="chk-food" class="w-6 h-6 rounded accent-emerald-600"/>
      <span class="text-sm text-gray-700">🍚 ゴハンを補充</span>
    </label>`
  el.innerHTML = `
    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wide">基本確認</h2>
    <div class="space-y-4">
      <div>
        <p class="text-sm font-medium text-gray-700 mb-3">🟡 オシッコ</p>
        <div class="flex items-center gap-3 mb-2">
          ${counterInner('pee')}
        </div>
        <div class="flex flex-wrap gap-2">
          ${statusBtns('pee-status', ['普通','多い','少ない'])}
        </div>
      </div>
      <div>
        <p class="text-sm font-medium text-gray-700 mb-3">🟤 ウンチ</p>
        <div class="flex items-center gap-3 mb-2">
          ${counterInner('poop')}
        </div>
        <div class="flex flex-wrap gap-2">
          ${statusBtns('poop-status', ['普通','柔らかい','硬い','多い','少ない'])}
        </div>
      </div>
      <div>
        <label class="flex items-center gap-2.5">
          <input type="checkbox" id="chk-soiling" class="w-6 h-6 rounded accent-red-500"/>
          <span class="text-sm font-medium text-gray-700">⚠️ 粗相があった</span>
        </label>
        <input type="text" id="soiling-place" placeholder="場所（例：玄関マット）"
          class="mt-2 w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 hidden"/>
      </div>
    </div>
    <div class="flex flex-wrap gap-4 pt-2 border-t border-gray-100">${checks}</div>`

  // 粗相チェックで場所入力を表示
  document.getElementById('chk-soiling').addEventListener('change', function() {
    document.getElementById('soiling-place').classList.toggle('hidden', !this.checked)
  })
}

function counterInner(key) {
  return `
    <button onclick="dec('${key}')"
      class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 text-xl font-medium flex items-center justify-center active:bg-gray-200 select-none">−</button>
    <span id="c-${key}" class="text-xl font-bold text-gray-900 w-8 text-center tabular-nums">0</span>
    <button onclick="inc('${key}')"
      class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-700 text-xl font-medium flex items-center justify-center active:bg-emerald-100 select-none">＋</button>
    <span class="text-sm text-gray-400">回</span>`
}

function statusBtns(id, options) {
  return options.map((o,i) =>
    `<button id="${id}-${i}" onclick="selectStatus('${id}',${i},'${o}')"
      class="px-3 py-1.5 rounded-full text-xs border border-gray-300 text-gray-600 transition-colors select-none">${o}</button>`
  ).join('')
}

function counter(key, label) {
  return `
    <div class="flex items-center gap-3">
      <span class="text-sm text-gray-600 w-28">${label}</span>
      <button onclick="dec('${key}')"
        class="w-10 h-10 rounded-full bg-gray-100 text-gray-600 text-xl font-medium flex items-center justify-center active:bg-gray-200 transition-colors select-none">−</button>
      <span id="c-${key}" class="text-xl font-bold text-gray-900 w-8 text-center tabular-nums">0</span>
      <button onclick="inc('${key}')"
        class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-700 text-xl font-medium flex items-center justify-center active:bg-emerald-100 transition-colors select-none">＋</button>
      <span class="text-sm text-gray-400">回</span>
    </div>`
}

function inc(k) { counts[k]++; document.getElementById('c-'+k).textContent = counts[k] }
function dec(k) { if(counts[k]>0){counts[k]--;document.getElementById('c-'+k).textContent=counts[k]} }

let statuses = {}
function selectStatus(id, idx, label) {
  statuses[id] = label
  // ボタンの見た目を切り替え
  const btns = document.querySelectorAll(`[id^="${id}-"]`)
  btns.forEach((b, i) => {
    b.className = i === idx
      ? 'px-3 py-1.5 rounded-full text-xs border text-white transition-colors select-none ' +
        (id.startsWith('poop') ? 'bg-amber-600 border-amber-600' : 'bg-blue-500 border-blue-500')
      : 'px-3 py-1.5 rounded-full text-xs border border-gray-300 text-gray-600 transition-colors select-none'
  })
}

// ──────────────────────────────────────────────────
// 音声入力（全幅ボタン）
// ──────────────────────────────────────────────────
function toggleMic() {
  isRecording ? stopMic() : startMic()
}

function startMic() {
  if (!speechOK) return
  if (recognizer) try { recognizer.abort() } catch(e){}

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition
  recognizer = new SR()
  recognizer.lang = 'ja-JP'
  recognizer.continuous = true    // 話し続けられる
  recognizer.interimResults = false

  recognizer.onresult = e => {
    const ta = document.getElementById('f-notes')
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) {
        const t = e.results[i][0].transcript
        ta.value = ta.value ? ta.value + '\n' + t : t
      }
    }
  }
  recognizer.onend  = () => { if(isRecording) { try{recognizer.start()}catch(e){} } }
  recognizer.onerror = () => stopMic()

  recognizer.start()
  isRecording = true

  const ta  = document.getElementById('f-notes')
  const btn = document.getElementById('mic-btn')
  ta.classList.add('border-red-200','bg-red-50')
  ta.classList.remove('border-gray-200','bg-gray-50')
  btn.className = 'w-full py-5 rounded-2xl text-base font-bold flex items-center justify-center gap-3 bg-red-500 text-white shadow-md mic-pulse transition-all'
  btn.innerHTML = `<span class="w-3 h-3 rounded-full bg-white inline-block"></span>録音中… もう一度押すと停止`
}

function stopMic() {
  isRecording = false
  if (recognizer) { try{recognizer.abort()}catch(e){} recognizer=null }

  const ta  = document.getElementById('f-notes')
  const btn = document.getElementById('mic-btn')
  if (!ta || !btn) return
  ta.classList.remove('border-red-200','bg-red-50')
  ta.classList.add('border-gray-200','bg-gray-50')
  btn.className = 'w-full py-5 rounded-2xl text-base font-bold flex items-center justify-center gap-3 bg-emerald-600 text-white shadow-md active:bg-emerald-700 transition-all'
  btn.innerHTML = `<svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 15 6.7 12H5c0 3.42 2.72 6.23 6 6.72V21h2v-2.28c3.28-.49 6-3.3 6-6.72h-1.7z"/></svg>押して話す`
}

// ──────────────────────────────────────────────────
// GENERATE（モック）
// ──────────────────────────────────────────────────
function handleGenerate() {
  const ci     = +document.getElementById('r-client').value
  const client = clients.filter(c=>c.pets.length)[ci]
  if (!client) return
  const pets = client.pets   // 全ペット

  const startDt = document.getElementById('r-start').value
  const endT    = document.getElementById('r-end').value
  if (!startDt || !endT) { showErr('日時を入力してください'); return }

  const notes = document.getElementById('f-notes').value.trim()

  stopMic()
  const btn = document.getElementById('btn-gen')
  btn.disabled = true
  btn.innerHTML = `<span class="spin w-5 h-5 border-2 border-white border-t-transparent rounded-full"></span>&nbsp;AI が報告文を生成中…`
  document.getElementById('r-error').classList.add('hidden')

  setTimeout(() => {
    const dt = fmtDt(startDt, endT)
    const report = buildReport(pets, dt, notes)
    document.getElementById('preview-text').value = report
    btn.disabled = false
    btn.innerHTML = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>AIで報告文を生成`
    go('preview')
  }, 2000)
}

function showErr(msg) {
  const el = document.getElementById('r-error')
  el.textContent = msg; el.classList.remove('hidden')
}

function buildReport(pets, dt, notes) {
  const hasDog = pets.some(p=>p.type==='dog')
  const hasCat = pets.some(p=>p.type==='cat')
  // ペット名を「〇〇くんと△△ちゃん」形式に
  const nameStr = pets.map(p=>`${p.name}${p.type==='dog'?'くん':'ちゃん'}`).join('と')
  const lines = [dt, '===', '本日のお世話の様子です！', '']

  // メイン（音声入力テキスト）
  if (notes) { lines.push(notes, '') }
  else { lines.push(`今日も${nameStr}のお世話をさせていただきました！`, '') }

  // 構造化データ（基本確認）
  const structured = []
  const pee = counts.pee, poop = counts.poop
  const peeStatus  = statuses['pee-status']  || ''
  const poopStatus = statuses['poop-status'] || ''

  // 排泄テキスト生成
  const buildExcretion = (isDog) => {
    const exc = []
    if (pee) {
      let t = `オシッコ${pee}回`
      if (peeStatus && peeStatus !== '普通') t += `（${peeStatus}）`
      exc.push(t)
    }
    if (poop) {
      let t = `ウンチ${poop}回`
      if (poopStatus && poopStatus !== '普通') t += `（${poopStatus}）`
      exc.push(t)
    }
    if (exc.length) {
      const label = isDog ? '排泄は' : 'トイレは'
      structured.push(`${label}${exc.join('、')}ありました。`)
    }
    // 粗相
    if (document.getElementById('chk-soiling')?.checked) {
      const place = document.getElementById('soiling-place')?.value.trim()
      structured.push(`粗相がありました。${place ? `（${place}）` : ''}お掃除させていただきました。`)
    }
  }

  if (hasDog) {
    buildExcretion(true)
    if (document.getElementById('chk-feed')?.checked)      structured.push('ゴハンはしっかり食べてくれました。')
    if (document.getElementById('chk-water-dog')?.checked) structured.push('お水もよく飲んでいました。')
  }
  if (hasCat) {
    if (!hasDog) buildExcretion(false)
    if (document.getElementById('chk-toilet')?.checked)    structured.push('トイレはすべてお掃除させていただきました。')
    if (document.getElementById('chk-water-cat')?.checked) structured.push('お水は交換いたしました。')
    if (document.getElementById('chk-food')?.checked)      structured.push('ゴハンは補充してあります。')
  }
  if (structured.length) lines.push(structured.join('\n'), '')

  const locked    = document.getElementById('chk-lock')?.checked
  const nextStart = document.getElementById('f-next-start')?.value
  const nextEnd   = document.getElementById('f-next-end')?.value
  if (locked) lines.push('施錠・退出いたしました。', '')
  if (nextStart) {
    const nextDt = nextEnd ? fmtDt(nextStart, nextEnd) : fmtDtDate(nextStart)
    lines.push(`次回は${nextDt}にお伺い予定です。`, '')
  }

  lines.push('本日もありがとうございました🙏🏻', '', 'またご依頼ございましたらお知らせくださいませ🙏🏻')
  return lines.join('\n')
}

// ──────────────────────────────────────────────────
// COPY
// ──────────────────────────────────────────────────
async function copyReport() {
  const text = document.getElementById('preview-text').value
  try { await navigator.clipboard.writeText(text) } catch {
    const ta = Object.assign(document.createElement('textarea'),{value:text,style:'position:fixed;opacity:0'})
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta)
  }
  const b = document.getElementById('copy-banner')
  b.style.opacity='1'
  setTimeout(()=>{ b.style.opacity='0' }, 2500)
}

// ──────────────────────────────────────────────────
// UTILS
// ──────────────────────────────────────────────────
function fmtDt(s, e) {
  const d = new Date(s), D=['日','月','火','水','木','金','土'], p=n=>String(n).padStart(2,'0')
  return `${d.getMonth()+1}/${d.getDate()}（${D[d.getDay()]}）${p(d.getHours())}:${p(d.getMinutes())}-${e}`
}
function fmtDtDate(s) {
  const d = new Date(s), D=['日','月','火','水','木','金','土'], p=n=>String(n).padStart(2,'0')
  return `${d.getMonth()+1}/${d.getDate()}（${D[d.getDay()]}）${p(d.getHours())}:${p(d.getMinutes())}`
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

// ──────────────────────────────────────────────────
init()
</script>
